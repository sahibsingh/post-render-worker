name: Render

# Started by the Postora app (workflow_dispatch with a job id) and, as a safety net, every 20 minutes to pick up anything queued.
# The workflow takes no pull request or push triggers, so nobody else can run it with the secrets.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Render job id (empty = take the oldest queued jobs)"
        required: false
        type: string
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: read

# One render run at a time; a new request waits instead of cancelling the one in progress.
concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
    steps:
      # A scheduled run first asks whether anything is queued, so an empty queue costs a few seconds, not a full install.
      - name: Check the queue
        id: queue
        run: |
          if [ -n "${{ inputs.job_id }}" ]; then echo "work=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          count=$(curl -s -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Prefer: count=exact" -I "$SUPABASE_URL/rest/v1/render_jobs?select=id&status=in.(queued,rendering)&limit=1" | grep -i '^content-range' | sed 's/.*\///' | tr -d '\r ')
          if [ -n "$count" ] && [ "$count" != "0" ]; then echo "work=yes" >> "$GITHUB_OUTPUT"; else echo "work=no" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.queue.outputs.work == 'yes'
      - uses: actions/setup-node@v4
        if: steps.queue.outputs.work == 'yes'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.queue.outputs.work == 'yes'
        run: npm ci
      - name: Install the browser
        if: steps.queue.outputs.work == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0 libcups2
          npx remotion browser ensure
      - name: Install the voice program
        if: steps.queue.outputs.work == 'yes'
        run: |
          pip install --quiet piper-tts==1.8.0
          echo "PIPER_MODEL=$HOME/voices/hi_IN-pratham-medium.onnx" >> "$GITHUB_ENV"
      - name: Remember the voice file
        id: voice
        if: steps.queue.outputs.work == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/voices
          key: piper-hi_IN-pratham-medium-v1
      - name: Download the voice file
        if: steps.queue.outputs.work == 'yes' && steps.voice.outputs.cache-hit != 'true'
        run: python3 -m piper.download_voices --download-dir "$HOME/voices" hi_IN-pratham-medium
      - name: Render
        if: steps.queue.outputs.work == 'yes'
        env:
          JOB_ID: ${{ inputs.job_id }}
          MAX_JOBS: "3"
        run: npm run worker
